[server]
runOnSave = true

[theme]
base="dark"
# This controls the sidebar color.
# I picked a Deep Navy Blue to match your blueprint theme.
secondaryBackgroundColor="#05101F" 

# This controls the main background (behind your grid image if it's transparent)
backgroundColor="#0E1117"

# This controls the accent color (buttons, sliders, etc.)
primaryColor="#3B82F6" 

# This controls the text color
textColor="#FAFAFA"
[theme]
base = "dark"
# The Primary Color (Affects Buttons & Sliders)
# Choose ONE of these options:

# Option A: MHF Cyan (Matches your logo accents - Recommended)
primaryColor = "#00B4D8"

# Option B: Engineering Blue (Trustworthy & Professional)
# primaryColor = "#1E88E5"

# Option C: Safety Orange (High visibility like a vest, but not "Error Red")
# primaryColor = "#FFC107"

# Background color (Dark Navy - matches your blueprint style)
backgroundColor = "#0E1117"

# Secondary background (for sidebars/widgets)
secondaryBackgroundColor = "#262730"

# Text color
textColor = "#FAFAFA"

