name: Keep Streamlit Awake (Selenium)

on:
  schedule:
    - cron: "*/20 * * * *"   # Every 20 minutes
  workflow_dispatch:

jobs:
  wake_app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          pip install selenium

      - name: Run Selenium Script
        run: |
          python <<EOF
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import time

          url = "https://mhf-civil-calc.streamlit.app"

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")

          driver = webdriver.Chrome(options=options)

          try:
              driver.get(url)
              wait = WebDriverWait(driver, 20)

              # Try to find wake button
              try:
                  wake_button = wait.until(
                      EC.element_to_be_clickable((By.TAG_NAME, "button"))
                  )
                  print("Wake button found. Clicking...")
                  wake_button.click()
                  time.sleep(15)
              except:
                  print("Wake button not found — app likely already awake.")

              print("Final page title:", driver.title)

          except Exception as e:
              print("Error:", e)

          finally:
              driver.quit()
          EOF
