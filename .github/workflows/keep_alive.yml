name: Keep Streamlit Awake (Precise Button)

on:
  schedule:
    - cron: "*/20 * * * *"   # Runs every 20 minutes
  workflow_dispatch:

jobs:
  wake_app:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Selenium Script
        run: |
          python <<EOF
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from webdriver_manager.chrome import ChromeDriverManager
          import time

          url = "https://mhf-civil-calc.streamlit.app"

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")

          print("Launching headless Chrome...")
          driver = webdriver.Chrome(
              service=Service(ChromeDriverManager().install()),
              options=options
          )

          try:
              print("Opening URL...")
              driver.get(url)

              wait = WebDriverWait(driver, 40)

              try:
                  print("Looking for wake-up button...")
                  wake_button = wait.until(
                      EC.element_to_be_clickable(
                          (By.XPATH, "//button[normalize-space()='Yes, get this app back up!']")
                      )
                  )

                  print("Wake button found. Clicking...")
                  wake_button.click()

                  # Give Streamlit time to restart
                  time.sleep(25)

              except:
                  print("Wake button not found. App likely already awake.")

              print("Final Page Title:", driver.title)

          except Exception as e:
              print("Error occurred:", e)

          finally:
              driver.quit()
              print("Browser closed.")
          EOF
