name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/30 * * * *"   # Every 30 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Streamlit App
        run: |
          curl -L -s -o /dev/null -w "%{http_code}" https://mhf-civil-calc.streamlit.app/
